name: Publish CommunityCare AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "communitycare-ai 2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: |
          cat > next.config.ts <<'CONFIG'
          import type { NextConfig } from 'next';
          const config: NextConfig = {
            output: 'export',
            trailingSlash: true,
            basePath: '/communitycare-ai'
          };
          export default config;
          CONFIG
          pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "communitycare-ai 2/out"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
